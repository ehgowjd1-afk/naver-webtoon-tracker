name: 회차 댓글 분석

# scripts/cmt/cmt_pilot.mjs 를 손으로만 돌립니다 (자동 실행 없음). 매일 자동 수집(collect)과 완전히 따로 돌고, 실패해도 영향 없음.
# 작품마다 전 회차 베스트 댓글 + 댓글 수가 튄 회차의 공개 직후 댓글을 로그인 없이 모아(닉네임·아이디는 버림, 요청 간격 2초),
# AI로 반복 반응 묶음 찾기(Sonnet) → 댓글마다 표시 + 회차 요약(Haiku) → 불호 재확인(Sonnet) → 작품·독자 분석(Sonnet)을 만듭니다. (리디 트래커 2판과 같은 방식)
# 결과: 원문 없는 숫자·표시(result.json) + 원문 포함 잠긴 파일(full.enc.json, 사용자 컴퓨터에서만 열림)을 하루만 보관하는 결과물로.
# 저장소에는 사이트용 결과(docs/data/cmt — 원문 없음)와 이 달 AI 사용액(state/ai_state.json)을 커밋합니다. 일괄은 보내는 즉시 예상 비용을 먼저 기록하고 끝나면 실제 금액으로 맞춥니다.
# 작품이 많으면: ids 에 전부 넣고 chunk 개씩 나눠 돕니다. 이번 실행이 앞 chunk 개를 하고, 성공하면 나머지로 이 워크플로를 다시 부릅니다(한 번에 하나씩).

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "작품 titleId (쉼표로, 순서대로 처리)"
        type: string
        default: "769209,793275"
      chunk:
        description: "한 번에 처리할 작품 수(최대 30) — 나머지는 다음 실행으로 넘김"
        type: string
        default: "20"
      cap_usd:
        description: "실행 1번 비용 상한(달러) — 예상이 넘으면 보내지 않음"
        type: string
        default: "3"
      limit_usd:
        description: "이 달 네이버 AI 한도(달러) — 넘을 것 같으면 보내지 않고 멈춤"
        type: string
        default: "30"
      mock:
        description: "가짜 답 모드(돈 안 듦)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # 남은 작품으로 이 워크플로를 다시 부를 때

concurrency:
  group: ai-comments
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Claude SDK 설치
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk@0.132.1
      # 입력값은 환경 변수로 넘김(명령줄에 바로 붙이지 않음). 형식이 이상하면 멈춘다.
      - name: 이번 실행 몫 나누기
        id: split
        env:
          IDS: ${{ inputs.ids }}
          CHUNK: ${{ inputs.chunk }}
        run: |
          echo "$IDS" | grep -Eq '^[0-9]{3,9}(,[0-9]{3,9})*$' || { echo "ids 형식 오류"; exit 1; }
          echo "$CHUNK" | grep -Eq '^[0-9]{1,2}$' && [ "$CHUNK" -ge 1 ] && [ "$CHUNK" -le 30 ] || { echo "chunk 는 1~30"; exit 1; }
          now=$(echo "$IDS" | tr ',' '\n' | head -n "$CHUNK" | paste -sd, -)
          rest=$(echo "$IDS" | tr ',' '\n' | tail -n +"$((CHUNK + 1))" | paste -sd, -)
          echo "now=$now" >> "$GITHUB_OUTPUT"
          echo "rest=$rest" >> "$GITHUB_OUTPUT"
          echo "이번: $now"; echo "다음으로: ${rest:-없음}"
      - name: 분석 실행
        id: run
        timeout-minutes: 325
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDS: ${{ steps.split.outputs.now }}
          CAP_USD: ${{ inputs.cap_usd }}
          LIMIT_USD: ${{ inputs.limit_usd }}
          CMT_MOCK: ${{ inputs.mock && '1' || '' }}
        run: node scripts/cmt/cmt_pilot.mjs --ids "$IDS" --cap-usd "$CAP_USD" --limit-usd "$LIMIT_USD" --wait-min 320 --summary "$GITHUB_STEP_SUMMARY"
      - name: 결과물 올리기 (하루 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmt-pilot-${{ github.run_id }}
          path: cmt_out/
          retention-days: 1
          if-no-files-found: ignore
      # 사이트용(원문 없음: 숫자·묶음 이름·AI 요약)으로 내보내서 docs/data/cmt 에 합침 → 사이트 작품 상세에 바로 보임
      - name: 사이트 반영 + 이 달 AI 사용액 커밋
        if: always()
        run: |
          node scripts/cmt/export_site.mjs cmt_out/result.json docs/data/cmt || echo "사이트 내보내기 실패(사용액만 커밋)"
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          [ -f state/ai_state.json ] && git add state/ai_state.json
          [ -d docs/data/cmt ] && git add docs/data/cmt
          git diff --cached --quiet && exit 0
          git commit -m "data: 댓글 분석 사이트 반영 + AI 사용액"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0 || (git rebase --abort 2>/dev/null; sleep 5); done
          exit 1
      # 이번 몫이 성공했을 때만 남은 작품으로 다시 부름(실패·한도 초과면 멈춤)
      - name: 남은 작품 다음 실행으로
        if: success() && steps.split.outputs.rest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REST: ${{ steps.split.outputs.rest }}
          CHUNK: ${{ inputs.chunk }}
          CAP_USD: ${{ inputs.cap_usd }}
          LIMIT_USD: ${{ inputs.limit_usd }}
          MOCK: ${{ inputs.mock }}
        run: gh workflow run cmt-pilot.yml --ref "${{ github.ref_name }}" -f ids="$REST" -f chunk="$CHUNK" -f cap_usd="$CAP_USD" -f limit_usd="$LIMIT_USD" -f mock="$MOCK"
