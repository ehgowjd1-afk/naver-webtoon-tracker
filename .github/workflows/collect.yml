name: collect
# 요일별·장르별·시리즈(일/주/월) 공개 랭킹을 매일 자동 수집.
# 앱 「이번 주 웹툰 랭킹」(전체/여성/남성)은 앱 전용이라 여기서 수집 불가 → 수동 커밋.
on:
  schedule:
    # GitHub 스케줄 크론은 자주 지연·누락됨(실제로 이틀 연속 누락) → 예비 시각 여러 개 등록.
    # 하나라도 뜨면 수집되고, 오늘 이미 수집됐으면 아래 '가드' 스텝이 즉시 스킵하므로 중복 없음.
    - cron: "15 0 * * *"   # 00:15 UTC = 09:15 KST (주 시각)
    - cron: "15 3 * * *"   # 03:15 UTC = 12:15 KST (예비 1)
    - cron: "15 6 * * *"   # 06:15 UTC = 15:15 KST (예비 2)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # ref: main = 작업이 실제로 시작할 때의 최신 main. (기본값은 예약이 걸린 순간의 커밋이라, 앞 수집이 끝나길 기다렸다 시작해도 옛 데이터를 보고
      # 가드를 통과해 한 번 더 돌고, 그 사이 올라간 성인 수집 결과를 덮었음 — 2026-10-11)
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30   # 가드가 최근 커밋 이력을 확인(오늘 이미 수집됐는지)
      - name: 오늘 이미 수집됐는지 확인 (예약 실행만 스킵, 수동은 항상 실행)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git log -30 --pretty=%s | grep -Fxq "auto: 랭킹 자동수집 $(date -u +%Y-%m-%d)"; then
            echo "오늘 이미 수집됨(예약) — 스킵"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.done == 'false'
        with:
          node-version: 24
      - name: 수집
        if: steps.guard.outputs.done == 'false'
        run: node scripts/collect.js
      - name: 원작 웹소설 찾기(새 작품·30일 지난 작품 40개)
        if: steps.guard.outputs.done == 'false'
        run: node scripts/collect_origins.js --max=40 || echo "원작 찾기 실패 — 넘어감"
      - name: 커밋 & 푸시
        if: steps.guard.outputs.done == 'false'
        run: |
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          # 수집하는 동안 다른 수집(성인·로컬)이 먼저 올린 값을 덮지 않게 원격과 합친 뒤 올림(날짜 도장이 새로운 쪽, 빈 칸 채움)
          git fetch -q origin main && node scripts/merge_remote.js origin/main || echo "원격 합치기 실패 — 그대로 올림"
          git add docs/data/weekday.json docs/data/series.json docs/data/promo.json docs/data/series_details.json docs/data/series_extra.json docs/data/revenue_history.json docs/data/ep_history.json docs/data/fav_history.json docs/data/lookup.json docs/data/details.json docs/data/history.json docs/data/episodes docs/data/episodes_index.json docs/data/ep_counts docs/data/cmt_history.json docs/data/app_genre docs/data/launch_weeks.json docs/data/origins.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 스킵"; exit 0
          fi
          git commit -m "auto: 랭킹 자동수집 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && exit 0 || (git rebase --abort 2>/dev/null; sleep 5)
          done
          echo "push 실패"; exit 1
