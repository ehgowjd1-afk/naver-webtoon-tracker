name: collect
# 요일별·장르별·시리즈(일/주/월) 공개 랭킹을 매일 자동 수집.
# 앱 「이번 주 웹툰 랭킹」(전체/여성/남성)은 앱 전용이라 여기서 수집 불가 → 수동 커밋.
on:
  schedule:
    - cron: "15 0 * * *"   # 00:15 UTC = 09:15 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 수집
        run: node scripts/collect.js
      - name: 커밋 & 푸시
        run: |
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data/weekday.json docs/data/genre.json docs/data/series.json docs/data/promo.json docs/data/lookup.json docs/data/details.json docs/data/history.json docs/data/episodes docs/data/episodes_index.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 스킵"; exit 0
          fi
          git commit -m "auto: 랭킹 자동수집 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0 || sleep 5
          done
          echo "push 실패"; exit 1
