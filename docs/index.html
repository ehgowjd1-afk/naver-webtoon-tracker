<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>네이버웹툰 랭킹</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="네이버웹툰·시리즈 랭킹 트래커 — 앱 주간(전체/여성/남성) · 요일별 · 장르별 · 시리즈 일/주/월. 순위 변동·연속·신작 진입을 매주 기록합니다.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">네이버웹툰 · 시리즈 랭킹 트래커</p>
      <h1>네이버웹툰 랭킹</h1>
      <p class="meta" id="meta">—</p>
    </div>
    <div class="htools">
      <select class="wsel" id="wsel" aria-label="주차 선택"></select>
      <button class="themebtn" id="dlbtn" aria-label="엑셀 다운로드" title="현재 화면 엑셀(CSV) 다운로드">⬇</button>
      <button class="themebtn" id="tbtn" aria-label="테마 전환" title="라이트/다크 전환">◐</button>
    </div>
  </header>

  <nav class="srcnav" id="srcnav" role="tablist" aria-label="랭킹 소스"></nav>
  <div class="varnav" id="varnav" role="tablist" aria-label="앱/웹 선택" hidden></div>
  <div class="subnav" id="subnav" role="tablist" aria-label="세부 선택"></div>

  <section class="tiles" id="tiles" hidden></section>
  <section class="panels" id="panels" hidden>
    <div class="panel" aria-label="순위 변동 분포">
      <div class="lab">순위 변동 분포</div>
      <div class="bar" id="distbar"></div>
      <div class="dleg" id="distleg"></div>
    </div>
    <div class="panel" id="gapPanel" aria-label="여성 vs 남성 온도차">
      <div class="lab">여성 ↔ 남성 취향 온도차</div>
      <p class="gaphint" id="gaphint"></p>
      <div class="gap" id="gap"></div>
    </div>
  </section>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" type="search" placeholder="작품·작가 검색" autocomplete="off">
    </div>
    <div class="chips" id="filters" role="group" aria-label="필터"></div>
    <div class="chips" id="sorts" role="group" aria-label="정렬"></div>
  </div>

  <p class="count" id="count"></p>
  <ol class="board" id="board"><li class="empty">불러오는 중…</li></ol>

  <footer>
    <p style="margin:0 0 6px"><b>앱 주간</b>(전체/여성/남성)은 앱 전용이라 매주 캡처로 수집하고, <b>요일별·장르별·시리즈</b>는 공개 API에서 <b>매일 자동 수집</b>됩니다.</p>
    <p style="margin:0; color:var(--faint)">상승=빨강 / 하락=파랑 (한국 관례) · 순위를 누르면 작품 상세 · 출처: 네이버웹툰 · 네이버 시리즈</p>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-back" id="modalBack"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="modal-x" id="modalX" aria-label="닫기">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
</html>
